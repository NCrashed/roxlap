[package]
name = "roxlap-cave-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "Procedural-cave showcase demo for the roxlap voxel engine."
# Demo binary; ships via `gh release create`, not crates.io.
publish = false

[[bin]]
name = "roxlap-cave-demo"
path = "src/main.rs"

[dependencies]
roxlap-core = { path = "../roxlap-core", version = "0.19" }
roxlap-formats = { path = "../roxlap-formats", version = "0.19" }
roxlap-cavegen = { path = "../roxlap-cavegen", version = "0.19" }
roxlap-scene = { path = "../roxlap-scene", version = "0.19" }
roxlap-render = { path = "../roxlap-render", version = "0.19" }
glam = { workspace = true }
winit = "0.30"

[lints]
workspace = true
