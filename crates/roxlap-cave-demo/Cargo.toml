[package]
name = "roxlap-cave-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "Procedural-cave showcase demo for the roxlap voxel engine."
# Demo binary; ships via `gh release create`, not crates.io.
publish = false

[[bin]]
name = "roxlap-cave-demo"
path = "src/main.rs"

[dependencies]
# QE.2b - roxlap-render reports diagnostics (GPU-init fallback, light
# budget demotion) through the `log` facade; env_logger surfaces them
# on stderr like the pre-QE.2 eprintln!s did (RUST_LOG adjusts
# verbosity).
env_logger = "0.11"
roxlap-core = { path = "../roxlap-core", version = "0.26" }
roxlap-formats = { path = "../roxlap-formats", version = "0.26" }
roxlap-cavegen = { path = "../roxlap-cavegen", version = "0.26" }
roxlap-scene = { path = "../roxlap-scene", version = "0.26" }
roxlap-render = { path = "../roxlap-render", version = "0.26" }
glam = { workspace = true }
winit = "0.30"
# AU.3 — voxel-aware audio, opt-in (native, needs an audio device +
# ALSA on Linux). Off by default so the demo builds/ships silent
# without pulling in kira/cpal:
#   cargo run -p roxlap-cave-demo --features audio
roxlap-audio = { path = "../roxlap-audio", version = "0.26", features = [
    "kira",
], optional = true }

[features]
audio = ["dep:roxlap-audio"]

[lints]
workspace = true
