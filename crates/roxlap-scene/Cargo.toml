[package]
name = "roxlap-scene"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "Scene-graph layer for the roxlap voxel engine: many independent chunked voxel grids, each with f64 world position and Quat rotation."
documentation = "https://docs.rs/roxlap-scene"
keywords = ["voxlap", "voxel", "scene-graph", "chunk", "engine"]
categories = ["game-development", "graphics"]

[dependencies]
glam = { workspace = true }
roxlap-cavegen = { path = "../roxlap-cavegen", version = "0.22" }
roxlap-core = { path = "../roxlap-core", version = "0.22" }
roxlap-formats = { path = "../roxlap-formats", version = "0.22" }
serde = { workspace = true }
# QE.5b — the versioned snapshot wire format
# (`Scene::save_snapshot` / `load_snapshot`: magic + u32 version +
# bincode payload) makes the payload codec concrete, so bincode
# graduates from dev-dependency to dependency. Hosts wanting another
# payload codec still serialise `Scene::to_snapshot`'s serde value
# themselves. Pinned to 1.x for wire stability.
bincode = "1"

# S7.3: background chunk-generation pool + result channel. Both are
# native-only — on wasm32 the streaming pump short-circuits to the
# synchronous path (no rayon::ThreadPool::build there without the
# wasm-bindgen-rayon adapter, which is a binary-side concern).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }
crossbeam-channel = { workspace = true }

[lints]
workspace = true
