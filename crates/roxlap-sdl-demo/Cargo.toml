[package]
name = "roxlap-sdl-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "SDL2 host demo for the roxlap scene-graph engine — shows that roxlap-render binds to any raw-window-handle window provider, not just winit."
# Demo binary, not a published library.
publish = false

[dependencies]
# QE.2b - roxlap-render reports diagnostics (GPU-init fallback, light
# budget demotion) through the `log` facade; env_logger surfaces them
# on stderr like the pre-QE.2 eprintln!s did (RUST_LOG adjusts
# verbosity).
env_logger = "0.11"
# The renderer facade. Decoupled from winit since 0.7: `SceneRenderer`
# binds to any `HasWindowHandle`/`HasDisplayHandle` provider. This
# demo proves the point with SDL2 instead of winit.
roxlap-render = { path = "../roxlap-render", version = "0.32" }
# Scene/world types + the edit API used to build the demo scene.
roxlap-scene = { path = "../roxlap-scene", version = "0.32" }
# Camera, OpticastSettings, Sky — the per-frame render params.
roxlap-core = { path = "../roxlap-core", version = "0.32" }
glam = { workspace = true }
# The window provider under test. The `raw-window-handle` feature pulls
# rwh 0.6 (matching softbuffer/wgpu inside roxlap-render) and makes
# `sdl2::video::Window` implement `HasWindowHandle`/`HasDisplayHandle`.
sdl2 = { version = "0.37", features = ["raw-window-handle"] }
# Same rwh version roxlap-render re-exports — used for the Send+Sync
# handle wrapper (SDL windows are !Send/!Sync; see `main.rs`).
raw-window-handle = "0.6"

[lints]
workspace = true
