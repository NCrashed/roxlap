<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>roxlap — pure-Rust voxlap port (web demo)</title>
    <!-- trunk inlines the wasm-bindgen JS glue + .wasm next to this
         file when it sees the data-trunk attribute. The crate's
         `start()` hook auto-runs after import. No `data-bin` —
         roxlap-web is a `cdylib` lib target, not a [[bin]]; trunk
         picks up the lib automatically. -->
    <link data-trunk rel="rust" />
    <style>
      html, body {
        margin: 0;
        background: #111;
        color: #eee;
        font: 14px/1.4 system-ui, sans-serif;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
      }
      canvas {
        image-rendering: pixelated;
        background: #000;
        max-width: 100%;
        height: auto;
        box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      }
      h1 {
        font-size: 16px;
        font-weight: 500;
        margin: 0;
      }
      a {
        color: #6cf;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>roxlap web demo · oracle world</h1>
      <canvas id="roxlap-canvas" width="640" height="480"></canvas>
      <p>
        WASD / arrows move · Space / Shift up &amp; down · click canvas to mouse-look · <kbd>B</kbd> runs a 300-frame bench (results in devtools console)
      </p>
    </main>
  </body>
</html>
