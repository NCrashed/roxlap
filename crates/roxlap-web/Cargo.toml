[package]
name = "roxlap-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "roxlap web demo — wasm32 + wasm-bindgen + canvas frontend for the engine."
# Bin-shaped: a wasm bundle, not a library to link against. Never
# publishable to crates.io (the deliverable is the static HTML +
# wasm bundle that `trunk build` emits, not a Rust dep).
publish = false

# `cdylib` is the crate-type wasm-bindgen needs to produce its JS
# glue. `rlib` lets `cargo doc` and intra-workspace consumers (none
# planned today) link against it normally.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# GW.2: the demo now renders through the unified facade (WebGPU
# marcher + automatic CPU/WebGL2 fallback). roxlap-core supplies
# Camera / Engine / OpticastSettings for the per-frame FrameParams;
# roxlap-scene builds the voxel world (Scene + Grid edits); glam types
# the grid coords. The WebGL2 presenter + opticast call site that used
# to live here now live inside roxlap-render.
roxlap-core = { path = "../roxlap-core", version = "0.31" }
roxlap-render = { path = "../roxlap-render", version = "0.31" }
roxlap-scene = { path = "../roxlap-scene", version = "0.31" }
glam = { workspace = true }

# wasm-bindgen / web-sys versions pinned to the same major+minor as
# the `wasm-bindgen-cli` shipped by nixpkgs — a schema mismatch between
# the macro-generated glue and the CLI fails the build. When nixpkgs
# bumps the CLI, lift these in lockstep.
wasm-bindgen = "=0.2.117"
console_error_panic_hook = "0.1"
# R10.X.2: spin a Web-Worker-backed rayon thread pool. The
# crate exposes an `init_thread_pool` JS export that we re-
# export from `lib.rs` so JS can `await initThreadPool(N)`
# before any rayon-using code runs. Worker count is chosen JS-
# side via `navigator.hardwareConcurrency`.
wasm-bindgen-rayon = "1.3"
# R10.X.2: `JsFuture::from(promise).await` lets us await
# `wasm_bindgen_rayon::init_thread_pool`'s JS Promise from
# Rust inside a `spawn_local` future. That keeps the JS init
# dance Rust-side rather than fighting trunk's auto-imports.
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
# DOM + input only — the framebuffer presentation (WebGL2 blit on the
# CPU path / wgpu surface on the GPU path) is owned by roxlap-render
# now, so the `WebGl*` features moved there.
features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Performance",
    "console",
    "KeyboardEvent",
    "MouseEvent",
    # R10.X.4: touch input for mobile.
    "Touch",
    "TouchEvent",
    "TouchList",
    "DomRect",
    # R10.X.2: `Navigator.hardwareConcurrency` decides how many
    # rayon worker threads to spin up.
    "Navigator",
]

[lints]
workspace = true
