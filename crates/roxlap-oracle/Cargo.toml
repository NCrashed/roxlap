[package]
name = "roxlap-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Cross-engine render-hash oracle for roxlap (R8)."
# Test harness, not for downstream consumption — never publish to
# crates.io. The oracle's purpose is regression-gating against
# voxlaptest C, useful only inside this workspace.
publish = false

[[bin]]
name = "roxlap-oracle"
path = "src/main.rs"

[dependencies]
roxlap-core = { path = "../roxlap-core", version = "0.12" }
roxlap-formats = { path = "../roxlap-formats", version = "0.12" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# S1.W: outside-camera regression tests build a synthetic thin-floor
# scene matching roxlap-host's small test scene to repro the BLACK
# pentagon. Test-only; does not affect crate publication.
roxlap-cavegen = { path = "../roxlap-cavegen", version = "0.12" }

# R10.1: wasm-bindgen-test scaffolding. Pulled in only when the
# build target is wasm32; native cargo runs (the bin's golden-diff
# CLI, the bench harness) skip these entirely.
#
# `wasm-bindgen` is pinned to `=0.2.117` because the bindgen schema
# version baked into the .wasm by `#[wasm_bindgen]` macros must
# match the schema version of the `wasm-bindgen-test-runner` /
# `wasm-bindgen` CLI shipped by `nixpkgs.wasm-bindgen-cli`. Bumping
# nixpkgs may move the CLI to a newer version; if it does, lift
# this pin to match. `wasm-bindgen-test` is pinned to the
# corresponding `0.3.x` release. `console_error_panic_hook` makes
# panic backtraces show up in Node's stderr instead of being
# swallowed.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "=0.2.117"
wasm-bindgen-test = "=0.3.67"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[lints]
workspace = true
