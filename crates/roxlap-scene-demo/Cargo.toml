[package]
name = "roxlap-scene-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Interactive showcase of the roxlap scene-graph engine — multiple voxel grids in one world."
# Demo binary; ships via `gh release create`, not crates.io.
publish = false

[[bin]]
name = "roxlap-scene-demo"
path = "src/main.rs"

[dependencies]
# QE.2b - roxlap-render reports diagnostics (GPU-init fallback, light
# budget demotion) through the `log` facade; env_logger surfaces them
# on stderr like the pre-QE.2 eprintln!s did (RUST_LOG adjusts
# verbosity).
env_logger = "0.11"
glam = { workspace = true }
png = "0.17"
roxlap-core = { path = "../roxlap-core", version = "0.29" }
roxlap-formats = { path = "../roxlap-formats", version = "0.29" }
# RF: unified CPU/GPU renderer facade. Owns presentation + the
# Scene→GPU bridge + the CPU compositor; `ROXLAP_GPU=1` selects the
# GPU backend with automatic CPU fallback. The demo no longer touches
# roxlap-gpu or softbuffer directly.
roxlap-render = { path = "../roxlap-render", features = ["hud", "gif"] }
roxlap-scene = { path = "../roxlap-scene", version = "0.29" }
# AU2.3 — the Audio scene computes live acoustics through the PURE
# core (no device, no threads), so the tab exists in every build; the
# `audio` feature below adds actual playback via kira.
roxlap-audio = { path = "../roxlap-audio", version = "0.29" }
winit = "0.30"
# BB.5 — the "Doom" scene synthesises its billboard sprites as animated
# GIFs at startup (the encoder), then feeds them back through the
# roxlap-render `gif` importer (the decoder) — dogfooding the full
# GIF → voxel-clip path without shipping a binary asset.
gif = "0.13"
# HUD overlay: the host runs egui itself and feeds the tessellated
# output to `SceneRenderer::paint_egui`. egui-winit translates winit
# events into egui input. Pinned to 0.29 to match roxlap-render's egui
# (egui-winit 0.29 → winit 0.30).
egui = "0.34"
egui-winit = "0.34"

[features]
# AU2.3 — audible playback for the Audio scene (kira backend; the
# scene's live numbers work without it). Off by default, mirroring
# the cave demo: a plain build never pulls in an audio device.
audio = ["roxlap-audio/kira"]

[lints]
workspace = true
