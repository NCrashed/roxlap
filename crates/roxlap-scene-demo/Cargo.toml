[package]
name = "roxlap-scene-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Interactive showcase of the roxlap scene-graph engine — multiple voxel grids in one world."
# Demo binary; ships via `gh release create`, not crates.io.
publish = false

[[bin]]
name = "roxlap-scene-demo"
path = "src/main.rs"

[dependencies]
glam = { workspace = true }
png = "0.17"
roxlap-core = { path = "../roxlap-core", version = "0.5" }
roxlap-formats = { path = "../roxlap-formats", version = "0.5" }
# RF: unified CPU/GPU renderer facade. Owns presentation + the
# Scene→GPU bridge + the CPU compositor; `ROXLAP_GPU=1` selects the
# GPU backend with automatic CPU fallback. The demo no longer touches
# roxlap-gpu or softbuffer directly.
roxlap-render = { path = "../roxlap-render" }
roxlap-scene = { path = "../roxlap-scene", version = "0.5" }
winit = "0.30"

[lints]
workspace = true
