[package]
name = "roxlap-formats"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "Voxlap on-disk format parsers (.vxl, .kv6, .kvx, .kfa)."
documentation = "https://docs.rs/roxlap-formats"
keywords = ["voxlap", "voxel", "parser", "kv6", "vxl"]
categories = ["parser-implementations", "game-development", "graphics"]

[dependencies]
# VCL — `.rvc` per-chunk deflate (occupancy bitmasks + colour runs
# compress well). Pure-Rust deflate, already in the tree transitively
# (flate2 / png). The crate's only runtime dependency.
miniz_oxide = { workspace = true }
# BB — optional GIF decoder for the billboard-sprite importer
# (`gif_import`). Pure-Rust (weezl LZW); behind the `gif` feature so the
# core format crate stays dependency-light when unused.
gif = { workspace = true, optional = true }
# BB — optional PNG / APNG decoder for the billboard-sprite importer
# (`png_import`). Pure-Rust (miniz_oxide backend); behind the `png` feature.
png = { workspace = true, optional = true }

[features]
# BB.0 — animated-GIF → VoxelClip importer (`gif_import` module).
gif = ["dep:gif"]
# BB — PNG-sequence / APNG → VoxelClip importer (`png_import` module).
png = ["dep:png"]

[dev-dependencies]
# R2.3: oracle.vxl.gz fixture is the procedurally-built world voxlaptest
# renders, gzipped for repo-friendly size (37 MB → 200 KB). Pure-Rust
# backend so this crate has no native build deps.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
