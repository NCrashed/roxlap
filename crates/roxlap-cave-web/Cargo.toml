[package]
name = "roxlap-cave-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "roxlap cave demo for the browser — cave-gen + bullets + carves on wasm32 + canvas."
# Bin-shaped: a wasm bundle, not a library to link against. The
# deliverable is the static HTML + wasm bundle that `trunk build`
# emits, not a Rust dep.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
roxlap-core = { path = "../roxlap-core", version = "0.2" }
roxlap-cavegen = { path = "../roxlap-cavegen", version = "0.2" }
roxlap-formats = { path = "../roxlap-formats", version = "0.2" }

# wasm-bindgen / web-sys versions pinned to the same major+minor as
# `wasm-bindgen-cli` shipped by nixpkgs (see crates/roxlap-oracle/
# Cargo.toml's R10.1 block for the schema-mismatch reasoning).
wasm-bindgen = "=0.2.117"
js-sys = "0.3"
console_error_panic_hook = "0.1"
# R10.X.2: Web-Worker-backed rayon thread pool. `init_thread_pool`
# is re-exported from lib.rs so JS awaits the worker spin-up
# before calling `start()`.
wasm-bindgen-rayon = "1.3"
# R10.X.2: `JsFuture::from(promise).await` lets us await
# `wasm_bindgen_rayon::init_thread_pool`'s Promise from Rust.
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
# R10.X.3: WebGL2 blit (texture upload + fullscreen quad) replaces
# the 2D `putImageData` path. Frag shader does the BGRA→RGBA
# swizzle on GPU; pack_rgba step disappears entirely.
features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Performance",
    "console",
    "KeyboardEvent",
    "MouseEvent",
    # R10.X.4: touch input for mobile.
    "Touch",
    "TouchEvent",
    "TouchList",
    "DomRect",
    "HtmlElement",
    # R10.X.2: `Navigator.hardwareConcurrency` for rayon's
    # worker count.
    "Navigator",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlTexture",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
]

[lints]
workspace = true
