[package]
name = "roxlap-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "winit + softbuffer demo host for the roxlap engine."
# Not published to crates.io for v0.1 — the host's `include_bytes!`
# calls reference workspace-shared assets at `../../../assets/`,
# which sit outside the package directory and are silently dropped
# by cargo's tarball builder. Reaching `cargo install roxlap-host`
# parity would mean either relocating the shared assets under this
# crate's tree or splitting them into a `roxlap-assets` crate; both
# are scoped for a follow-up release. For v0.1 the host ships as a
# binary in GitHub releases, and `git clone + cargo run` continues
# to work zero-setup for development users.
publish = false

[[bin]]
name = "roxlap-host"
path = "src/main.rs"

[dependencies]
roxlap-core = { path = "../roxlap-core", version = "0.25" }
roxlap-formats = { path = "../roxlap-formats", version = "0.25" }
# S1.X: small procedural test scene for the outside-camera scene
# engine work. The default oracle.vxl is a 2 km^2 enclosed cave —
# not flyable from outside. roxlap-cavegen at vsid=128 + edge-strip
# gives an open structure suitable for orbital probing.
roxlap-cavegen = { path = "../roxlap-cavegen", version = "0.25" }
# winit + softbuffer is a pure-Rust windowing + framebuffer-blit pair
# that compiles on Linux / Windows / macOS today and on wasm32 once
# R10 lands.
winit = "0.30"
softbuffer = "0.4"
# flate2 with the rust_backend feature stays pure-Rust (no native
# zlib link), matching roxlap-formats's `oracle.vxl.gz` decode.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Pure-Rust PNG decoder for the embedded `assets/sky.png` panorama.
# Default features include the deflate codec (also pure-Rust); no
# native deps.
png = "0.17"

[lints]
workspace = true
