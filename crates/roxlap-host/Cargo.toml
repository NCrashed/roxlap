[package]
name = "roxlap-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "winit + softbuffer demo host for the roxlap engine."
documentation = "https://docs.rs/roxlap-host"
keywords = ["voxlap", "voxel", "demo", "winit", "viewer"]
categories = ["game-development", "graphics", "rendering"]
# Assets the host's `include_bytes!` calls reference (oracle world,
# kv6 sprites, sky panorama). Paths are relative to this crate's
# directory; cargo preserves the workspace-relative layout in the
# published tarball so `include_bytes!("../../../assets/...")`
# still resolves at downstream-build time.
include = [
    "src/**/*",
    "../../assets/coco.kv6",
    "../../assets/oracle.vxl.gz",
    "../../assets/sky.png",
    "../../crates/roxlap-core/tests/fixtures/sprite_meltsphere.kv6",
]

[[bin]]
name = "roxlap-host"
path = "src/main.rs"

[dependencies]
roxlap-core = { path = "../roxlap-core", version = "0.1" }
roxlap-formats = { path = "../roxlap-formats", version = "0.1" }
# winit + softbuffer is a pure-Rust windowing + framebuffer-blit pair
# that compiles on Linux / Windows / macOS today and on wasm32 once
# R10 lands.
winit = "0.30"
softbuffer = "0.4"
# flate2 with the rust_backend feature stays pure-Rust (no native
# zlib link), matching roxlap-formats's `oracle.vxl.gz` decode.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Pure-Rust PNG decoder for the embedded `assets/sky.png` panorama.
# Default features include the deflate codec (also pure-Rust); no
# native deps.
png = "0.17"

[lints]
workspace = true
