[package]
name = "roxlap-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "winit + softbuffer demo host for the roxlap engine."

[[bin]]
name = "roxlap-host"
path = "src/main.rs"

[dependencies]
roxlap-core = { path = "../roxlap-core" }
# winit + softbuffer is a pure-Rust windowing + framebuffer-blit pair
# that compiles on Linux / Windows / macOS today and on wasm32 once
# R10 lands.
winit = "0.30"
softbuffer = "0.4"

[lints]
workspace = true
