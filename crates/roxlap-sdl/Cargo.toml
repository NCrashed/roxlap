[package]
name = "roxlap-sdl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "SDL2-hosted demo binary for the roxlap engine."

[[bin]]
name = "roxlap-sdl"
path = "src/main.rs"

[dependencies]
roxlap-core = { path = "../roxlap-core" }
# SDL2 binding. Default features cover the basic video / event surface
# we need; `bundled` (would compile SDL2 from source) is intentionally
# off because the workspace's flake.nix already supplies SDL2 + pkg-
# config in the dev shell.
sdl2 = "0.36"

[lints]
workspace = true
