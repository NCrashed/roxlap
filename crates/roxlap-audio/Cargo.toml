[package]
name = "roxlap-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "Voxel-aware acoustics for the roxlap engine — occlusion/muffling through voxel walls and cavity-driven reverb parameters, playback-backend agnostic."
documentation = "https://docs.rs/roxlap-audio"
keywords = ["voxlap", "voxel", "audio", "acoustics", "occlusion"]
categories = ["game-development", "multimedia::audio"]

# The acoustics CORE is pure parameter computation over a
# `roxlap_scene::Scene` (no audio device, no audio thread, fully
# unit-testable). Playback is opt-in behind the `kira` feature (AU.2)
# — the trait boundary `AudioOut` keeps the backend swappable; see
# docs/porting/PORTING-AUDIO.md.
[dependencies]
roxlap-scene = { path = "../roxlap-scene", version = "0.27" }
# AU2.0 — colour→material classification for per-material absorption
# (the same `material_for_color` map the renderer + debris system use).
roxlap-formats = { path = "../roxlap-formats", version = "0.27" }
glam = { workspace = true }
# AU.2 — pinned MINOR (kira has a history of breaking track-API
# redesigns: 0.9→0.10→0.12); every kira type stays behind `AudioOut`.
kira = { version = "0.12", optional = true, default-features = false, features = [
    "cpal",
] }
# kira takes positions/orientations as `mint` types; `glam/mint` gives
# the Vec3/Quat → mint conversions. Both are pulled in only by the
# `kira` feature.
mint = { version = "0.5", optional = true }

[features]
# The kira 0.12 playback backend (native; needs an audio device — on
# Linux, ALSA headers at build time via pkg-config, see flake.nix).
kira = ["dep:kira", "dep:mint", "glam/mint"]

# Maintainer's listening probe (a real audio device required):
# `cargo run -p roxlap-audio --features kira --example audio_probe`
[[example]]
name = "audio_probe"
required-features = ["kira"]

[lints]
workspace = true
