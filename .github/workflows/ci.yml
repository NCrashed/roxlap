name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rustfmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  wasm-check:
    name: cargo check (wasm32 web crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # CC.4 lesson: `roxlap-web` / `roxlap-cave-web` are
      # `#![cfg(target_arch = "wasm32")]` — on native targets their
      # whole body is cfg'd away, so the workspace clippy job only
      # PARSES them and type errors ship silently (the colour-newtype
      # migration missed both, and nothing noticed). This stable
      # wasm32 check is the type gate; the threaded trunk build
      # (nightly + build-std) stays a local concern.
      - run: cargo check -p roxlap-web -p roxlap-cave-web --target wasm32-unknown-unknown
        env:
          # The workflow-global RUSTFLAGS env OVERRIDES
          # .cargo/config.toml's [target.wasm32-unknown-unknown]
          # rustflags, silently dropping the +atomics feature set
          # that wasm-bindgen-rayon compile_error!-asserts on — so
          # re-state the target features here alongside -D warnings.
          # (Type-check only: no linking, so the config's link-args
          # and the nightly build-std std rebuild aren't needed.
          # rustc's "unstable feature ... atomics" note is a
          # driver warning without a lint name; -D warnings does
          # not promote it.)
          RUSTFLAGS: -D warnings -C target-feature=+simd128,+atomics,+bulk-memory,+mutable-globals

  test:
    name: cargo test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `roxlap-sdl-demo` links system SDL2 (`-lSDL2`), which isn't on
      # the runner, and has no tests anyway — exclude it from the test
      # link. It's still compile-checked by the clippy job
      # (`--all-targets`), so API breakage against `roxlap-render` is
      # caught. (To link it in CI instead, `apt-get install libsdl2-dev`
      # here, or add the sdl2 `bundled` feature for a self-contained build.)
      - run: cargo test --workspace --release --exclude roxlap-sdl-demo

  book:
    name: book (anchors + mdbook build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # BK.0: the book pulls code via `{{#include ...:anchor}}` from
      # CI-compiled crate examples / README anchors. mdbook itself does
      # NOT fail on a broken include (missing file → logged ERROR +
      # exit 0; missing anchor → silent empty snippet), so the real
      # anti-rot gate is check-anchors.sh; the grep over the build log
      # is a belt-and-braces catch for anything else mdbook only warns
      # about. Version pinned to match the nixpkgs mdbook in the dev
      # shell (flake.nix).
      - name: Check include anchors
        run: docs/book/check-anchors.sh
      - name: Install mdbook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/rust-lang/mdBook/releases/download/v0.5.2/mdbook-v0.5.2-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build book (fail on warnings)
        run: |
          mdbook build docs/book 2>&1 | tee mdbook-build.log
          ! grep -qE '(ERROR|WARN)' mdbook-build.log
      # BK.7 — the built book is the Pages artifact; the deploy job
      # below publishes it on master pushes only (PRs still build +
      # gate, they just don't deploy).
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        with:
          path: docs/book/book

  # BK.7 — publish the book to GitHub Pages
  # (https://ncrashed.github.io/roxlap/). Needs Pages enabled in the
  # repo settings with "GitHub Actions" as the source.
  deploy-book:
    name: deploy book to gh-pages
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: book
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
