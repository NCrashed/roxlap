# R10.1: wasm32-unknown-unknown test binaries can't be executed
# directly; cargo needs a runner that loads the wasm under a JS
# host. `wasm-bindgen-test-runner` (shipped inside the
# `wasm-bindgen-cli` package) wraps the wasm + a generated JS shim
# and invokes Node. The `nix develop` shell exposes both via
# `pkgs.wasm-bindgen-cli` + `pkgs.nodejs` (see flake.nix R10.1
# packages).
[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"
# R10.3: enable WebAssembly SIMD (`simd128`) for the four
# `core::arch::wasm32::f32x4_*` 4-pixel batches in
# `roxlap-core/src/scalar_rasterizer.rs`. Without this flag the
# intrinsics compile but lower to scalar wasm — so SIMD code looks
# correct on the wire but doesn't actually accelerate.
#
# R10.X.2: enable wasm threads via `wasm-bindgen-rayon`. The
# `+atomics`, `+bulk-memory`, `+mutable-globals` features expose
# the wasm-threads instruction set (atomic load/store/cmpxchg,
# `memory.atomic.wait/notify`, shared-memory grow). The std crate
# is not built with these by default on wasm32-unknown-unknown,
# so `[unstable] build-std` below rebuilds it from `rust-src`
# (provided via the nightly toolchain in the web crates' `rust-toolchain.toml`).
# Wasm threads also require browser-side cross-origin isolation
# (COOP `same-origin` + COEP `require-corp`); see each web
# crate's `Trunk.toml`.
rustflags = [
    "-C",
    "target-feature=+simd128,+atomics,+bulk-memory,+mutable-globals",
    # R10.X.2: enabling `+atomics` is necessary but not sufficient.
    # The wasm linker (`rust-lld`) only marks the produced wasm
    # memory as `shared` if it sees `--shared-memory` AND the
    # memory is imported (not internal) — `--import-memory` flips
    # that. `--max-memory` is required by the spec for shared
    # memories. Without these, wasm-bindgen-rayon's
    # `Atomics.waitAsync(int32, ...)` blows up at runtime with
    # "is not a shared typed array" because the wasm memory is a
    # regular ArrayBuffer.
    "-C",
    "link-arg=--shared-memory",
    "-C",
    "link-arg=--import-memory",
    "-C",
    "link-arg=--max-memory=4294967296",
    # `wasm-bindgen` looks up `__wasm_init_tls` while preparing the
    # module for threading; the linker would otherwise GC it as
    # unused. Same for `__wasm_init_memory_flag` and
    # `__tls_size` which the rayon worker entry needs to know.
    "-C",
    "link-arg=--export=__wasm_init_tls",
    "-C",
    "link-arg=--export=__wasm_init_memory_flag",
    "-C",
    "link-arg=--export=__tls_size",
    "-C",
    "link-arg=--export=__tls_align",
    "-C",
    "link-arg=--export=__tls_base",
]

# R10.X.2: rebuild std with the threading-enabled features above
# so rayon's `std::thread::Thread`-using code paths compile under
# wasm-bindgen-rayon's Worker-backed pool. Requires nightly cargo
# (the channel pinned in `crates/roxlap-web/rust-toolchain.toml` — build from inside a web crate dir so rustup picks it up).
[unstable]
build-std = ["std", "panic_abort"]
