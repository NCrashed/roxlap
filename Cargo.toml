[workspace]
members = [
    "crates/roxlap-cave-demo",
    "crates/roxlap-cave-web",
    "crates/roxlap-cavegen",
    "crates/roxlap-core",
    "crates/roxlap-formats",
    "crates/roxlap-host",
    "crates/roxlap-oracle",
    "crates/roxlap-web",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NCrashed/roxlap"
authors = ["Anton Gushcha <ncrashed@gmail.com>"]
rust-version = "1.77"
# Workspace-root README; per-crate Cargo.toml inherits via
# `readme.workspace = true` so all published crates point at the
# same pitch document.
readme = "README.md"

[workspace.dependencies]
# R12 multicore rendering — rayon's work-stealing pool, par_iter, and
# join cover every parallelism axis we need (per-quadrant in R12.2,
# per-tile in R12.3, per-column lighting bake in R12.4). Declared
# here in R12.0; first consumer is roxlap-core in R12.1.
rayon = "1.10"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Module-name redundancy is fine for small crates that may grow.
module_name_repetitions = "allow"
