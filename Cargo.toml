[workspace]
members = [
    "crates/roxlap-cave-demo",
    "crates/roxlap-cave-web",
    "crates/roxlap-cavegen",
    "crates/roxlap-core",
    "crates/roxlap-formats",
    "crates/roxlap-gpu",
    "crates/roxlap-host",
    "crates/roxlap-render",
    "crates/roxlap-scene",
    "crates/roxlap-scene-demo",
    "crates/roxlap-sdl-demo",
    "crates/roxlap-web",
]
resolver = "2"

[workspace.package]
version = "0.15.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NCrashed/roxlap"
authors = ["Anton Gushcha <ncrashed@gmail.com>"]
rust-version = "1.77"
# Workspace-root README; per-crate Cargo.toml inherits via
# `readme.workspace = true` so all published crates point at the
# same pitch document.
readme = "README.md"

[workspace.dependencies]
# VCL — pure-Rust deflate for `.rvc` per-chunk compression (roxlap-formats
# `voxel_clip`). Already present transitively (flate2 / png); pinned here
# so the direct dependency tracks the same major.
miniz_oxide = "0.8"
# R12 multicore rendering — rayon's work-stealing pool, par_iter, and
# join cover every parallelism axis we need (per-quadrant in R12.2,
# per-tile in R12.3, per-column lighting bake in R12.4). Declared
# here in R12.0; first consumer is roxlap-core in R12.1.
# S7.3 reuses rayon for a dedicated streaming `ThreadPool`
# (background chunk generation) — separate pool from R12's so
# render parallelism + stream generation don't compete for workers.
rayon = "1.10"
# S7.3 — background-generation result channel. `crossbeam-channel`'s
# MPMC bounded/unbounded variants are the canonical cross-thread
# queue in the rust ecosystem; we use `unbounded` for the
# generator-result inbox (one main-thread receiver, many rayon-task
# senders).
crossbeam-channel = "0.5"
# S2.0 — scene-graph crate's f64 world coords + quaternion grid
# rotation. `DVec3` covers the universe-level position math and
# `DQuat` is the per-grid orientation primitive S5 will compose with
# camera basis vectors. Pinned to a stable 0.x; std-only build.
# `serde` feature enabled for S2.3 scene-snapshot round-trip.
glam = { version = "0.30", default-features = false, features = ["std", "serde"] }
# S2.3 — serde derives for the scene snapshot (Scene → bytes → Scene
# round-trip). Format-agnostic — downstream picks bincode / postcard
# / json / etc.
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Module-name redundancy is fine for small crates that may grow.
module_name_repetitions = "allow"
# Pedantic lints this voxlap port trips pervasively *by design* — they
# were already suppressed ad-hoc across the tree (kfa.rs, kfa_draw.rs,
# sprite.rs, vxl.rs, grouscan.rs, …); centralising keeps new code
# consistent without scattering `#[allow]`s. The substantive pedantic
# lints (needless_pass_by_value, redundant_clone, …) stay on.
#  - voxlap-identifier-heavy doc prose
doc_markdown = "allow"
#  - parity names (z1/z1c, cx/cy, sx0/sy0, …)
similar_names = "allow"
many_single_char_names = "allow"
#  - the long monolithic asm-port phase functions + their signatures
too_many_lines = "allow"
too_many_arguments = "allow"
#  - bounded voxel-coordinate casts (z ≤ 255, small chunk counts, …)
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
#  - widening int→float / int→wider-int casts (`as f64`, `as i64`)
cast_lossless = "allow"
#  - `x & 0xffffff == 0` colour/flag masks read clearer than trailing_zeros
verbose_bit_mask = "allow"
#  - exact float sentinels (INFINITY thresholds, 0.0 disabled-radii, …)
float_cmp = "allow"
#  - panics are via assert!/expect! invariants, not documented per-fn
missing_panics_doc = "allow"
#  - `use super::*` in test modules + a few intentional glob re-exports
wildcard_imports = "allow"
#  - `.for_each()` / `if cond { panic! }` / item-after-stmt / match-else
#    are stylistic wash-vs-the-alternative
needless_for_each = "allow"
manual_assert = "allow"
items_after_statements = "allow"
single_match_else = "allow"
