# R10.X.2: nightly Rust toolchain pinned for the wasm-bindgen-rayon
# threading path. `wasm-bindgen-rayon` rebuilds std with `+atomics`
# via `-Z build-std`, which requires both nightly cargo and the
# `rust-src` component shipped here.
#
# Native (non-wasm) builds + tests work on this nightly identically
# to stable — there are no nightly-only features in the codebase
# except the build-std flag itself, which only fires on
# `--target wasm32-unknown-unknown`.
[toolchain]
channel = "nightly-2026-04-15"
components = ["rustc", "cargo", "rust-src", "rustfmt", "clippy", "rust-analyzer"]
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
